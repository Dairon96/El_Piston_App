name: el_piston
description: "App móvil offline para gestionar las órdenes de servicio del taller automotriz El Pistón (Flutter + Drift)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Persistencia local (SQLite) - Conferencia 7
  drift: ^2.20.0
  drift_flutter: ">=0.2.0 <1.0.0"
  path_provider: ^2.1.0

  # Navegación declarativa - Conferencia 3
  go_router: ">=14.0.0 <20.0.0"

  # Solo para recordar el modo claro/oscuro elegido
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <8.0.0"
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.0

# Ícono de la app: se genera con `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A314E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
